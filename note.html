<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Note</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    /* Add a simple fade-in for the loaded content */
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    /* This makes sure long notes wrap correctly */
    pre {
      white-space: pre-wrap;       /* CSS 3 */
      white-space: -moz-pre-wrap;  /* Mozilla, since 1999 */
      white-space: -pre-wrap;      /* Opera 4-6 */
      white-space: -o-pre-wrap;    /* Opera 7 */
      word-wrap: break-word;       /* Internet Explorer 5.5+ */
    }
  </style>
</head>
<body class="min-h-full bg-gradient-to-br from-slate-50 to-blue-50">

  <main class="container mx-auto px-6 py-8 max-w-2xl">
    <header class="text-center mb-8">
      <a href="/" class="flex items-center justify-center text-blue-600 hover:text-blue-800 transition-colors">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Create a new note
      </a>
    </header>

    <div class="bg-white rounded-2xl shadow-lg p-8 min-h-[300px]">
      
      <div id="loading-state" class="text-center py-12">
        <svg class="animate-spin h-8 w-8 text-blue-600 mx-auto" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="mt-4 text-lg text-gray-600">Loading note...</p>
      </div>

      <div id="error-state" class="hidden text-center py-12">
        <svg class="w-12 h-12 text-red-500 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <p class="mt-4 text-2xl font-semibold text-red-700">Note Not Found</p>
        <p class="mt-2 text-gray-600">This note may have been deleted or the link is incorrect.</p>
      </div>

      <div id="password-state" class="hidden text-center py-12">
        <svg class="w-12 h-12 text-blue-600 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        <p class="mt-4 text-2xl font-semibold text-gray-800">Password Required</p>
        <p class="mt-2 text-gray-600">This note is encrypted. Please enter the password to view it.</p>
        <form id="password-form" class="mt-6 max-w-sm mx-auto">
            <input type="password" id="password-input" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Enter password...">
            <button type="submit" class="mt-4 w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors">
                Decrypt
            </button>
            <p id="password-error" class="text-red-600 text-sm mt-2 hidden">Wrong password. Please try again.</p>
        </form>
      </div>

      <div id="note-content" class="hidden">
        <pre id="note-text" class="text-lg text-gray-800 leading-relaxed font-sans"></pre>
      </div>

    </div>
  </main>

  <script>
    // 3. UPDATED JAVASCRIPT LOGIC
    
    // Store encrypted content here when needed
    let encryptedContentToDecrypt = '';

    // Get references to all UI states
    const loadingDiv = document.getElementById('loading-state');
    const errorDiv = document.getElementById('error-state');
    const contentDiv = document.getElementById('note-content');
    const noteText = document.getElementById('note-text');
    const passwordDiv = document.getElementById('password-state');
    const passwordForm = document.getElementById('password-form');
    const passwordInput = document.getElementById('password-input');
    const passwordError = document.getElementById('password-error');

    async function loadNote() {
      try {
        // 1. Get the note ID from the URL
        const params = new URLSearchParams(window.location.search);
        const noteId = params.get('id');

        if (!noteId) {
          throw new Error('No note ID provided.');
        }

        // 2. Call our "get-note" function
        const response = await fetch(`/.netlify/functions/get-note?id=${noteId}`);

        if (!response.ok) {
          throw new Error('Note not found.');
        }

        // 3. Get the JSON data from the function
        const noteData = await response.json();

        // 4. Check if the note is encrypted
        //    (Assumes your server returns: { encrypted: true, content: "..." } or { encrypted: false, content: "..." })
        if (noteData.encrypted) {
          // Note IS encrypted
          encryptedContentToDecrypt = noteData.content; // Store content for decryption
          loadingDiv.classList.add('hidden');
          passwordDiv.classList.remove('hidden'); // Show password prompt
          passwordDiv.classList.add('fade-in');
        } else {
          // Note is NOT encrypted ("pass less")
          noteText.textContent = noteData.content;
          loadingDiv.classList.add('hidden');
          contentDiv.classList.remove('hidden');
          contentDiv.classList.add('fade-in');
        }

      } catch (error) {
        // Hide loading, show general error
        loadingDiv.classList.add('hidden');
        errorDiv.classList.remove('hidden');
      }
    }

    // Handle the password form submission
    passwordForm.addEventListener('submit', (event) => {
      event.preventDefault(); // Stop the form from reloading the page
      
      const password = passwordInput.value;
      if (!password || !encryptedContentToDecrypt) {
        passwordError.textContent = 'An unknown error occurred. Please refresh.';
        passwordError.classList.remove('hidden');
        return;
      }

      try {
        // Attempt to decrypt using AES (this must match your encryption method)
        const decrypted = CryptoJS.AES.decrypt(encryptedContentToDecrypt, password);
        const decryptedString = decrypted.toString(CryptoJS.enc.Utf8);

        if (!decryptedString) {
          // This happens if the password is wrong
          throw new Error('Wrong password');
        }

        // SUCCESS!
        noteText.textContent = decryptedString;
        passwordDiv.classList.add('hidden');
        contentDiv.classList.remove('hidden');
        contentDiv.classList.add('fade-in');
        passwordError.classList.add('hidden'); // Hide error if it was showing

      } catch (e) {
        // FAILURE! (Wrong password)
        passwordError.textContent = 'Wrong password. Please try again.';
        passwordError.classList.remove('hidden');
        passwordInput.value = ""; // Clear the wrong password
      }
    });

    // Run the loadNote function as soon as the page loads
    loadNote();
  </script>
</body>
</html>
