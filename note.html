<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Secure Note</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { box-sizing: border-box; }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .glass-effect { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.18); }
    .fade-in { animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }
  </style>
  <style>@view-transition { navigation: auto; }</style>
</head>
<body class="min-h-full gradient-bg">
  <main class="relative container mx-auto px-6 py-8 max-w-4xl min-h-screen flex items-center justify-center">
    
    <div id="note-container" class="glass-effect rounded-3xl p-8 shadow-2xl w-full fade-in">
      
      <div class="flex items-center mb-6">
        <div class="bg-white bg-opacity-20 p-3 rounded-full mr-4">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        </div>
        <div>
          <h1 id="note-heading" class="text-3xl font-bold text-white">Secure Note</h1>
        </div>
      </div>

      <div id="note-content" class="bg-white bg-opacity-10 rounded-2xl p-6 min-h-[200px]">
        <div id="loading-state" class="flex flex-col items-center justify-center h-full">
          <svg class="animate-spin h-8 w-8 text-white mb-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <p class="text-white text-opacity-80">Loading secure note...</p>
        </div>
        
        <div id="error-state" class="hidden flex-col items-center justify-center h-full">
           <svg class="w-12 h-12 text-red-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
           <p id="error-message" class="text-red-100 font-semibold text-center">Note not found or has expired.</p>
        </div>

        <pre id="note-display" class="hidden w-full p-2 bg-white bg-opacity-90 rounded-xl resize-none text-gray-800 text-lg leading-relaxed shadow-lg custom-scrollbar whitespace-pre-wrap font-sans min-h-[200px]"></pre>
      </div>

    </div>
  </main>

  <script>
    // Secure AES decryption function
    function realDecrypt(encryptedText, password) {
      try {
        const bytes = CryptoJS.AES.decrypt(encryptedText, password);
        const plaintext = bytes.toString(CryptoJS.enc.Utf8);
        if (!plaintext) {
          throw new Error('Invalid password or corrupted data');
        }
        return plaintext;
      } catch (error) {
        console.error('Decryption failed:', error);
        throw new Error('Failed to decrypt note - check your password');
      }
    }

    // UI state functions
    function showLoading() {
      document.getElementById('loading-state').classList.remove('hidden');
      document.getElementById('error-state').classList.add('hidden');
      document.getElementById('note-display').classList.add('hidden');
    }

    function showError(message) {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.remove('hidden');
      document.getElementById('error-state').classList.add('flex');
      document.getElementById('note-display').classList.add('hidden');
      document.getElementById('error-message').textContent = message;
      document.getElementById('note-heading').textContent = "Access Denied";
    }

    function showNote(plaintext) {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.add('hidden');
      document.getElementById('note-display').classList.remove('hidden');
      document.getElementById('note-display').textContent = plaintext;
    }

    // Main function to load the note
    window.addEventListener('load', async () => {
      showLoading();
      
      try {
        // 1. Get the note ID from the URL
        const params = new URLSearchParams(window.location.search);
        const noteId = params.get('id');

        if (!noteId) {
          throw new Error("No note ID provided in the URL.");
        }

        // 2. Call the Netlify function to get the note
        const response = await fetch(`/.netlify/functions/get-note?id=${noteId}`);
        
        if (response.status === 404) {
             throw new Error("Note not found or it has expired.");
        }
        if (!response.ok) {
            throw new Error("Could not retrieve the note.");
        }

        const note = await response.json();
        let plaintext = note.content;

        // 3. Handle password protection
        if (note.hasPassword) {
          const password = prompt("This note is password protected. Please enter the password:");
          
          if (!password) {
            showError("Password required to view this note.");
            return;
          }
          
          // 4. Decrypt the note
          try {
            plaintext = realDecrypt(note.content, password);
          } catch (e) {
            showError("Invalid password. Access denied.");
            return;
          }
        }
        
        // 5. Display the note
        showNote(plaintext);

      } catch (error) {
        console.error(error);
        showError(error.message);
      }
    });
  </script>
</body>
</html>
