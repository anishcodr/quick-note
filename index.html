  <script>
        // Configuration object for editable features
        const defaultConfig = {
            main_heading: "Share Your Thoughts Instantly",
            tagline: "Simple. Fast. Private.",
            placeholder_text: "Type your note here...",
            button_text: "Generate Shareable Link",
            primary_color: "#2563eb",
            accent_color: "#16a34a",
            background_color: "#f8fafc",
            text_color: "#1f2937",
            font_family: "Inter"
        };

        // Data SDK handler
        const dataHandler = {
            onDataChanged(data) {
                // This app is write-only for sharing notes
                // We don't need to display existing notes

        };

        // Generate a unique ID for the note
        function generateNoteId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        // Show loading state
        function showLoading(show) {
            const btn = document.getElementById('generate-btn');
            const btnText = document.getElementById('button-text');
            const spinner = document.getElementById('loading-spinner');
            
            if (show) {
                btn.disabled = true;
                btn.classList.add('opacity-75', 'cursor-not-allowed');
                btnText.textContent = 'Generating...';
                spinner.classList.remove('hidden');
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.textContent = window.elementSdk?.config?.button_text || defaultConfig.button_text;
                spinner.classList.add('hidden');
            }
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            const errorText = errorDiv.querySelector('p');
            errorText.textContent = message;
            errorDiv.classList.remove('hidden');
            errorDiv.classList.add('fade-in');
            
            setTimeout(() => {
                errorDiv.classList.add('hidden');
            }, 5000);
        }

            console.error(error); // Log the actual error
                showError('An unexpected error occurred. Please try again.');
            } finally {
                showLoading(false);
            }

        // Handle copy to clipboard
        async function handleCopy() {
            const linkInput = document.getElementById('generated-link');
            const copyBtn = document.getElementById('copy-btn');
            
            try {
                await navigator.clipboard.writeText(linkInput.value);
                
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('bg-green-700');
                
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.classList.remove('bg-green-700');
                }, 2000);
            } catch (error) {
                // Fallback for older browsers
                linkInput.select();
                document.execCommand('copy');
                
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            }
        }

        // Render function for Element SDK
        async function render(config) {
            const mainHeading = document.getElementById('main-heading');
            const tagline = document.getElementById('tagline');
            const textarea = document.getElementById('note-textarea');
            const buttonText = document.getElementById('button-text');
            
            // Update text content
            mainHeading.textContent = config.main_heading || defaultConfig.main_heading;
            tagline.textContent = config.tagline || defaultConfig.tagline;
            textarea.placeholder = config.placeholder_text || defaultConfig.placeholder_text;
            buttonText.textContent = config.button_text || defaultConfig.button_text;
            
            // Update colors
            const primaryColor = config.primary_color || defaultConfig.primary_color;
            const accentColor = config.accent_color || defaultConfig.accent_color;
            const textColor = config.text_color || defaultConfig.text_color;
            
            // Apply colors to elements
            document.documentElement.style.setProperty('--primary-color', primaryColor);
            document.documentElement.style.setProperty('--accent-color', accentColor);
            
            const generateBtn = document.getElementById('generate-btn');
            generateBtn.style.backgroundColor = primaryColor;
            
            const copyBtn = document.getElementById('copy-btn');
            copyBtn.style.backgroundColor = accentColor;
            
            // Apply font family
            const fontFamily = config.font_family || defaultConfig.font_family;
            if (fontFamily && fontFamily !== 'Inter') {
                document.body.style.fontFamily = `${fontFamily}, Inter, system-ui, -apple-system, sans-serif`;
            }
        }

        // Initialize the application
        async function init() {
            // Initialize Data SDK
            if (window.dataSdk) {
                const initResult = await window.dataSdk.init(dataHandler);
                if (!initResult.isOk) {
                    console.error('Failed to initialize Data SDK');
                }
            }

            // Initialize Element SDK
            if (window.elementSdk) {
                await window.elementSdk.init({
                    defaultConfig,
                    render,
                    mapToCapabilities: (config) => ({
                        recolorables: [
                            {
                                get: () => config.primary_color || defaultConfig.primary_color,
                                set: (value) => {
                                    config.primary_color = value;
                                    window.elementSdk.setConfig({ primary_color: value });
                                }
                            },
                            {
                                get: () => config.accent_color || defaultConfig.accent_color,
                                set: (value) => {
                                    config.accent_color = value;
                                    window.elementSdk.setConfig({ accent_color: value });
                                }
                            },
                            {
                                get: () => config.text_color || defaultConfig.text_color,
                                set: (value) => {
                                    config.text_color = value;
                                    window.elementSdk.setConfig({ text_color: value });
                                }
                            }
                        ],
                        borderables: [],
                        fontEditable: {
                            get: () => config.font_family || defaultConfig.font_family,
                            set: (value) => {
                                config.font_family = value;
                                window.elementSdk.setConfig({ font_family: value });
                            }
                        },
                        fontSizeable: undefined
                    }),
                    mapToEditPanelValues: (config) => new Map([
                        ['main_heading', config.main_heading || defaultConfig.main_heading],
                        ['tagline', config.tagline || defaultConfig.tagline],
                        ['placeholder_text', config.placeholder_text || defaultConfig.placeholder_text],
                        ['button_text', config.button_text || defaultConfig.button_text]
                    ])
                });
            }

            // Set up event listeners
            document.getElementById('note-form').addEventListener('submit', handleSubmit);
            document.getElementById('copy-btn').addEventListener('click', handleCopy);

            // Initial render
            await render(window.elementSdk?.config || defaultConfig);
        }

        // Start the application
        init();
    </script>
